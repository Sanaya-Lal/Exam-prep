name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Setup Keystore and Environment
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Decode debug keystore if base64 file is present
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Prepare .env from .env.example
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

          # If GEMINI_API_KEY secret is defined in GitHub repository secrets, inject it
          if [ -n "$GEMINI_API_KEY_SECRET" ]; then
            echo "Injecting GEMINI_API_KEY from repository secrets..."
            if grep -q "^GEMINI_API_KEY=" .env; then
              sed -i "s/^GEMINI_API_KEY=.*/GEMINI_API_KEY=$GEMINI_API_KEY_SECRET/" .env
            else
              echo "GEMINI_API_KEY=$GEMINI_API_KEY_SECRET" >> .env
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
